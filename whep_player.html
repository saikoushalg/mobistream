<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHEP Player - MediaMTX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            border-radius: 4px;
            z-index: 1000;
        }

        #status.error {
            background: rgba(255, 0, 0, 0.7);
        }

        #status.success {
            background: rgba(0, 255, 0, 0.7);
        }

        #status.connecting {
            background: rgba(255, 165, 0, 0.7);
        }

        #reconnect-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #aaa;
            font-family: monospace;
            font-size: 11px;
            border-radius: 4px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <div id="status">Initializing...</div>
    <div id="reconnect-info"></div>

    <script>
        // Configuration
        const CONFIG = {
            // Get stream ID from URL parameter (default: 'cam1')
            streamId: new URLSearchParams(window.location.search).get('stream') || 'cam1',

            // Get server IP from URL parameter (default: localhost)
            serverIp: new URLSearchParams(window.location.search).get('server') || '192.168.1.45',

            // Server port
            port: 8888,

            // Reconnection settings
            maxRetries: Infinity,
            retryDelay: 2000, // 2 seconds
            backoffMultiplier: 1.5,
            maxRetryDelay: 30000 // 30 seconds max
        };

        // State
        let pc = null;
        let retryCount = 0;
        let currentRetryDelay = CONFIG.retryDelay;
        let isConnecting = false;
        let isConnected = false;

        // DOM elements
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const reconnectInfoEl = document.getElementById('reconnect-info');

        // Logging
        function log(message, type = 'info') {
            console.log(`[${new Date().toISOString()}] ${message}`);
            statusEl.textContent = message;
            statusEl.className = type;

            if (type === 'connecting') {
                reconnectInfoEl.textContent = `Reconnect attempt ${retryCount + 1}...`;
            } else if (type === 'success') {
                reconnectInfoEl.textContent = `Connected to stream: ${CONFIG.streamId}`;
            } else if (type === 'error') {
                reconnectInfoEl.textContent = `Retry ${retryCount + 1} in ${Math.round(currentRetryDelay / 1000)}s`;
            }
        }

        // Create WebRTC Peer Connection
        function createPeerConnection() {
            const config = {
                iceServers: [] // No STUN servers for local network
            };

            pc = new RTCPeerConnection(config);

            // Handle incoming tracks
            pc.ontrack = (event) => {
                log('Received media track', 'success');
                if (event.streams && event.streams[0]) {
                    video.srcObject = event.streams[0];
                    isConnected = true;
                    retryCount = 0;
                    currentRetryDelay = CONFIG.retryDelay;
                }
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate === null) {
                    log('ICE gathering complete', 'success');
                } else {
                    log('ICE candidate received', 'connecting');
                }
            };

            // Handle connection state changes
            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                log(`Connection state: ${state}`, state === 'connected' ? 'success' : 'connecting');

                if (state === 'failed' || state === 'disconnected') {
                    isConnected = false;
                    scheduleReconnect();
                }
            };

            // Handle ICE connection state
            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                log(`ICE state: ${state}`, state === 'connected' ? 'success' : 'connecting');

                if (state === 'failed' || state === 'disconnected') {
                    isConnected = false;
                    scheduleReconnect();
                }
            };

            return pc;
        }

        // Start WHEP connection
        async function startStream() {
            if (isConnecting) return;
            isConnecting = true;

            try {
                log(`Connecting to stream: ${CONFIG.streamId}...`, 'connecting');

                // Create peer connection
                pc = createPeerConnection();

                // Create offer
                const offer = await pc.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });

                await pc.setLocalDescription(offer);

                // WHEP endpoint URL
                const whepUrl = `http://${CONFIG.serverIp}:${CONFIG.port}/whep/${CONFIG.streamId}`;

                log(`Sending WHEP request to: ${whepUrl}`, 'connecting');

                // Send WHEP POST request
                const response = await fetch(whepUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: offer.sdp
                });

                if (!response.ok) {
                    throw new Error(`WHEP request failed: ${response.status} ${response.statusText}`);
                }

                // Get SDP answer
                const answerSdp = await response.text();

                // Set remote description
                await pc.setRemoteDescription(new RTCSessionDescription({
                    type: 'answer',
                    sdp: answerSdp
                }));

                log('WHEP connection established', 'success');
                isConnecting = false;

            } catch (error) {
                log(`Connection failed: ${error.message}`, 'error');
                isConnecting = false;
                scheduleReconnect();
            }
        }

        // Schedule reconnection
        function scheduleReconnect() {
            if (retryCount >= CONFIG.maxRetries) {
                log('Max retries reached. Giving up.', 'error');
                return;
            }

            log(`Reconnecting in ${Math.round(currentRetryDelay / 1000)}s...`, 'error');

            setTimeout(() => {
                retryCount++;
                currentRetryDelay = Math.min(
                    currentRetryDelay * CONFIG.backoffMultiplier,
                    CONFIG.maxRetryDelay
                );

                // Cleanup old connection
                if (pc) {
                    pc.close();
                    pc = null;
                }

                startStream();
            }, currentRetryDelay);
        }

        // Stop stream
        function stopStream() {
            if (pc) {
                pc.close();
                pc = null;
            }
            isConnected = false;
            isConnecting = false;
        }

        // Start streaming on load
        window.addEventListener('load', () => {
            log(`WHEP Player - Stream: ${CONFIG.streamId}`, 'info');
            startStream();
        });

        // Handle page visibility
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Pause reconnection when tab is not visible
                log('Page hidden, pausing...', 'info');
            } else {
                // Resume when visible
                if (!isConnected) {
                    log('Page visible, reconnecting...', 'connecting');
                    startStream();
                }
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopStream();
        });
    </script>
</body>
</html>
