name: mobistream_whip
description: WHIP/WHEP live streaming with MediaMTX
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Permissions
  permission_handler: ^11.0.1
  wakelock_plus: ^1.4.0

  # Network
  network_info_plus: ^5.0.1

  # UI
  cupertino_icons: ^1.0.8

  # Camera & WebRTC
  flutter_webrtc: ^1.4.0
  http: ^1.1.0

  # Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
